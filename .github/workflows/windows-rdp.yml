name: Ubuntu Cloud SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup SSH User & Add SSH Key
        run: |
          # ساخت یوزر یکپارچه
          sudo useradd -m -s /bin/bash hanimain
          echo "hanimain:hanimainpassword" | sudo chpasswd
          sudo usermod -aG sudo hanimain
          
          # اضافه کردن کلید عمومی مک برای ورود بدون پسورد
          sudo mkdir -p /home/hanimain/.ssh
          echo "ssh-rsa  hexa@sharif" | sudo tee /home/hanimain/.ssh/authorized_keys
          sudo chown -R hanimain:hanimain /home/hanimain/.ssh
          sudo chmod 700 /home/hanimain/.ssh
          sudo chmod 600 /home/hanimain/.ssh/authorized_keys
          
          # فعال‌سازی بک‌آپ لاگین با پسورد (اختیاری جهت اطمینان)
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: 2. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-linux-server
          
          sleep 5
          TS_IP=$(tailscale ip -4)
          
          echo "=================================================="
          echo "  >>> LINUX SERVER IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : hanimain"
          echo "  Login Mode   : Passwordless (Mac SSH Key)"
          echo "  >> SSH Command: ssh hanimain@$TS_IP"
          echo "=================================================="

      - name: 3. Keep Server Alive (6 Hours)
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] Server running..."
          done
