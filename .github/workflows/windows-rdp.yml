name: Ubuntu Cloud SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup SSH User
        run: |
          sudo useradd -m -s /bin/bash cynetadmin
          echo "cynetadmin:Cynet@2026" | sudo chpasswd
          sudo usermod -aG sudo cynetadmin
          # Enable Password Authentication in SSH
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config.d/*.conf || true
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          sudo systemctl restart ssh

      - name: 2. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-linux-server
          
          sleep 5
          TS_IP=$(tailscale ip -4)
          
          echo "=================================================="
          echo "  >>> LINUX SERVER IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : hanimain"
          echo "  Password     : hanimainpassword"
          echo "  >> SSH Command: ssh cynetadmin@$TS_IP"
          echo "=================================================="

      - name: 3. Keep Server Alive (6 Hours)
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] Server running..."
          done
